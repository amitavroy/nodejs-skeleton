# Infrastructure only: the app itself runs on the host (npm run dev).
# Ports are configurable in .env so several projects can run side by side.
name: __APP_NAME__

services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Catches all outgoing dev mail. SMTP on SMTP_PORT, inbox at http://localhost:${MAILPIT_PORT}
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_PORT:-8025}:8025"

  # Postgres UI at http://localhost:${PGADMIN_PORT}, no login (desktop mode).
  # The server is preregistered from docker/pgadmin/servers.json; the password is DB_PASSWORD.
  pgadmin:
    image: dpage/pgadmin4:9
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASSWORD:-secret}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Container logs at http://localhost:${DOZZLE_PORT}
  dozzle:
    image: amir20/dozzle:latest
    ports:
      - "${DOZZLE_PORT:-9000}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  pgdata:
  redisdata:
  pgadmindata:
